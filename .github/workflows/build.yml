name: Compila MailAllegati

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblica una nuova release (versione presa dal programma)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trova la cartella android
        shell: bash
        run: |
          F=$(find . -path ./.git -prune -o -type f -name gradlew -print | head -1)
          if [ -z "$F" ]; then
            echo "::error::Cartella android non trovata: controlla di aver caricato la cartella 'android' completa"
            find . -path ./.git -prune -o -maxdepth 3 -print
            exit 1
          fi
          echo "ANDROID_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Cartella android: $(dirname "$F")"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compila APK
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rilascio.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/rilascio.keystore"
            echo "Firma con la chiave dei Secrets"
          else
            echo "::warning::Secrets della chiave Android mancanti: l'apk e' firmato con una chiave di prova"
          fi
          cd "$ANDROID_DIR"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          echo "sdk.dir=$SDK" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            # riporta gli errori come annotazioni (visibili anche senza aprire il registro)
            grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | head -40 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/MailAllegati.apk"
          cp LEGGIMI_AVVERTENZE.txt "$GITHUB_WORKSPACE/out/" || true
      - uses: actions/upload-artifact@v4
        with:
          name: MailAllegati-Android
          path: out/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trova la cartella windows
        shell: bash
        run: |
          F=$(find . -path ./.git -prune -o -type f -name mail_allegati.py -print | head -1)
          if [ -z "$F" ]; then
            echo "::error::Cartella windows non trovata: controlla di aver caricato la cartella 'windows' completa"
            find . -path ./.git -prune -o -maxdepth 3 -print
            exit 1
          fi
          echo "WIN_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Cartella windows: $(dirname "$F")"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila EXE
        shell: pwsh
        run: |
          Set-Location $env:WIN_DIR
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name MailAllegati --collect-submodules keyring.backends --hidden-import pystray._win32 --add-data "LEGGIMI_AVVERTENZE.txt;." mail_allegati.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item LEGGIMI_AVVERTENZE.txt dist\
      - name: Crea programma di installazione
        shell: pwsh
        run: |
          Set-Location $env:WIN_DIR
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\out" | Out-Null
          Copy-Item dist\* "$env:GITHUB_WORKSPACE\out\"
      - uses: actions/upload-artifact@v4
        with:
          name: MailAllegati-Windows
          path: out/

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.pubblica) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir up
          cp dist/MailAllegati-Windows/MailAllegati-Setup.exe up/
          cp dist/MailAllegati-Windows/MailAllegati.exe up/MailAllegati-portatile.exe
          cp dist/MailAllegati-Android/MailAllegati.apk up/MailAllegati-Android.apk
          cp dist/MailAllegati-Windows/LEGGIMI_AVVERTENZE.txt up/
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VER=$(grep -m1 -oP 'APP_VERSION = "\K[^"]+' windows/mail_core.py)
            TAG="v$VER"
          fi
          echo "Release: $TAG"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La release $TAG esiste gia': aumenta APP_VERSION in windows/mail_core.py"
            exit 1
          fi
          gh release create "$TAG" up/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MailAllegati $TAG" \
            --notes "Scarica MailAllegati-Setup.exe per Windows oppure MailAllegati-Android.apk per Android. Prima dell'uso leggi LEGGIMI_AVVERTENZE.txt."
